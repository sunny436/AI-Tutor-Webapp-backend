# Production PostgreSQL 16 + pgvector: the single source of truth for all application data.
#
# Started by aichat-postgres.service:
#   docker compose --env-file /etc/aichat/postgres.env -f deploy/compose/docker-compose.yml up -d
#
# Binds to 127.0.0.1 only. The volume IS the database: never `docker compose down -v`.
# Backups: aichat-pg-backup.timer runs deploy/backup.sh (pg_dump) nightly.
#
# The project and volume names are PINNED to the values production already uses. Compose
# would otherwise derive them from this folder's name, so moving or renaming the folder
# would silently start a NEW, EMPTY database. Never change these two names.
name: compose
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in /etc/aichat/postgres.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in /etc/aichat/postgres.env}
      POSTGRES_DB: ${POSTGRES_DB:-aichat}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  pgdata:
    name: compose_pgdata
