<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ayurveda & Yoga Assistant</title>
<style>
  /* ---------- Design tokens (calm, medical, minimal) ---------- */
  :root{
    --bg:#eef3f0; --bg2:#e3ece7; --card:#ffffff; --text:#1f2a28; --muted:#5c6b67;
    --accent:#0f766e; --accent-soft:#d7ede8; --user:#0f766e; --user-text:#ffffff;
    --border:#dde6e2; --danger:#b3261e; --danger-soft:#fdecea; --shadow:0 10px 30px rgba(15,118,110,.08);
    --radius:18px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0c1413; --bg2:#0f1a18; --card:#121e1c; --text:#e7efec; --muted:#9db2ac;
      --accent:#2dd4bf; --accent-soft:#123330; --user:#0d9488; --user-text:#04110f;
      --border:#1f302d; --danger:#ff6b6b; --danger-soft:#2a1414; --shadow:0 10px 30px rgba(0,0,0,.35);}
  }
  [data-theme="dark"]{ --bg:#0c1413; --bg2:#0f1a18; --card:#121e1c; --text:#e7efec; --muted:#9db2ac;
    --accent:#2dd4bf; --accent-soft:#123330; --user:#0d9488; --user-text:#04110f;
    --border:#1f302d; --danger:#ff6b6b; --danger-soft:#2a1414; --shadow:0 10px 30px rgba(0,0,0,.35);}
  [data-theme="light"]{ --bg:#eef3f0; --bg2:#e3ece7; --card:#ffffff; --text:#1f2a28; --muted:#5c6b67;
    --accent:#0f766e; --accent-soft:#d7ede8; --user:#0f766e; --user-text:#ffffff;
    --border:#dde6e2; --danger:#b3261e; --danger-soft:#fdecea; --shadow:0 10px 30px rgba(15,118,110,.08);}

  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,var(--bg),var(--bg2)); color:var(--text); height:100vh; overflow:hidden; }
  .app{ max-width:820px; margin:0 auto; height:100vh; display:flex; flex-direction:column; padding:0 16px; }

  /* Header */
  header{ display:flex; align-items:center; gap:12px; padding:18px 6px 12px; }
  .logo{ width:40px; height:40px; border-radius:12px; background:var(--accent-soft); display:grid; place-items:center; font-size:20px; }
  .titles h1{ font-size:17px; margin:0; font-weight:650; letter-spacing:.2px; }
  .titles p{ margin:2px 0 0; font-size:12px; color:var(--muted); }
  .spacer{ flex:1; }
  .iconbtn{ border:1px solid var(--border); background:var(--card); color:var(--text); width:38px; height:38px;
    border-radius:11px; cursor:pointer; font-size:16px; display:grid; place-items:center; transition:.15s; }
  .iconbtn:hover{ transform:translateY(-1px); box-shadow:var(--shadow); }
  .newbtn{ border:1px solid var(--border); background:var(--card); color:var(--text); padding:0 14px; height:38px;
    border-radius:11px; cursor:pointer; font-size:13px; font-weight:600; }
  .newbtn:hover{ box-shadow:var(--shadow); }

  /* Details panel */
  details.profile{ background:var(--card); border:1px solid var(--border); border-radius:14px; margin:4px 6px 0; box-shadow:var(--shadow); }
  details.profile summary{ cursor:pointer; padding:12px 16px; font-size:13px; font-weight:600; color:var(--muted); list-style:none; }
  details.profile summary::-webkit-details-marker{ display:none; }
  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:0 16px 16px; }
  .grid input,.grid select{ border:1px solid var(--border); background:transparent; color:var(--text);
    border-radius:10px; padding:9px 10px; font-size:13px; width:100%; }
  @media (max-width:560px){ .grid{ grid-template-columns:1fr 1fr; } }

  /* Chat area */
  .chat{ flex:1; overflow-y:auto; padding:16px 6px 8px; display:flex; flex-direction:column; gap:14px; }
  .msg{ display:flex; gap:10px; max-width:88%; animation:rise .25s ease; }
  @keyframes rise{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }
  .msg .avatar{ width:30px; height:30px; border-radius:9px; display:grid; place-items:center; font-size:15px; flex:none; }
  .msg.bot .avatar{ background:var(--accent-soft); }
  .bubble{ padding:13px 15px; border-radius:16px; font-size:14.5px; line-height:1.6; }
  .msg.bot{ align-self:flex-start; }
  .msg.bot .bubble{ background:var(--card); border:1px solid var(--border); border-top-left-radius:4px; box-shadow:var(--shadow); }
  .msg.user{ align-self:flex-end; flex-direction:row-reverse; }
  .msg.user .bubble{ background:var(--user); color:var(--user-text); border-top-right-radius:4px; }
  .bubble.danger{ background:var(--danger-soft); border:1px solid var(--danger); color:var(--danger); }
  .bubble h3{ margin:12px 0 4px; font-size:14px; color:var(--accent); }
  .bubble h3:first-child{ margin-top:0; }
  .bubble strong{ font-weight:700; }
  .knowledge{ font-size:11px; color:var(--muted); margin-top:6px; }

  /* typing dots */
  .dots span{ display:inline-block; width:6px; height:6px; margin:0 2px; background:var(--muted); border-radius:50%; animation:blink 1.2s infinite; }
  .dots span:nth-child(2){ animation-delay:.2s; } .dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,80%,100%{ opacity:.2;} 40%{ opacity:1;} }

  /* Input */
  .composer{ padding:10px 6px 16px; }
  .attachchip{ display:none; align-items:center; gap:8px; font-size:12px; color:var(--accent);
    background:var(--accent-soft); padding:6px 10px; border-radius:8px; margin-bottom:8px; width:fit-content; }
  .inputrow{ display:flex; gap:8px; align-items:flex-end; background:var(--card); border:1px solid var(--border);
    border-radius:16px; padding:8px; box-shadow:var(--shadow); }
  textarea#input{ flex:1; border:none; background:transparent; color:var(--text); resize:none; font-size:14.5px;
    font-family:inherit; max-height:120px; padding:8px; outline:none; }
  .sendbtn{ background:var(--accent); color:#fff; border:none; width:42px; height:42px; border-radius:12px;
    cursor:pointer; font-size:18px; flex:none; transition:.15s; }
  .sendbtn:hover{ filter:brightness(1.05); } .sendbtn:disabled{ opacity:.5; cursor:not-allowed; }
  .disclaimer{ text-align:center; font-size:11px; color:var(--muted); margin-top:9px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">🌿</div>
    <div class="titles">
      <h1>Ayurveda &amp; Yoga Assistant</h1>
      <p>Natural wellness guidance — never medicines</p>
    </div>
    <div class="spacer"></div>
    <button class="newbtn" id="newChat">＋ New chat</button>
    <button class="iconbtn" id="themeBtn" title="Toggle theme">🌙</button>
  </header>

  <details class="profile">
    <summary>Your details (optional — helps give a better answer)</summary>
    <div class="grid">
      <input id="age" placeholder="Age" />
      <input id="gender" placeholder="Gender" />
      <input id="food" placeholder="Food (veg / non-veg)" />
      <input id="sleep" placeholder="Sleep (e.g. 11pm–7am)" />
      <input id="water" placeholder="Water (e.g. 2L)" />
      <input id="stress" placeholder="Stress (low/med/high)" />
    </div>
  </details>

  <div class="chat" id="chat"></div>

  <div class="composer">
    <div class="attachchip" id="attachChip">📎 <span id="attachName"></span></div>
    <div class="inputrow">
      <button class="iconbtn" id="attachBtn" title="Attach a report (PDF/image)" style="border:none;background:transparent;">📎</button>
      <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg,.txt" hidden />
      <textarea id="input" rows="1" placeholder="Describe your problem… (e.g. I've had gas for 5 days)"></textarea>
      <button class="sendbtn" id="sendBtn">➤</button>
    </div>
    <div class="disclaimer">Educational wellness guidance only. If something seems serious, please see a doctor.</div>
  </div>
</div>

<script>
  // ---------- Conversation state ----------
  let problem = null;      // the first message = the problem
  let history = "";        // follow-up Q&A collected
  let followups = 0;
  let docText = "";        // text read from an uploaded report
  let lastKind = null;     // "followup" | "answer" | "escalation"
  let lastQuestion = "";   // the last question the assistant asked

  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");

  // ---------- Theme toggle ----------
  const themeBtn = document.getElementById("themeBtn");
  themeBtn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : (cur === "light" ? "dark" : "dark");
    document.documentElement.setAttribute("data-theme", next);
    themeBtn.textContent = next === "dark" ? "☀️" : "🌙";
  };

  // ---------- Helpers ----------
  function buildProfile(){
    const g = id => document.getElementById(id).value.trim();
    return `Age: ${g("age")}\nGender: ${g("gender")}\nFood preference: ${g("food")}\n` +
           `Sleep: ${g("sleep")}\nWater intake: ${g("water")}\nStress level: ${g("stress")}`;
  }

  // very small markdown: **bold**, **Heading** lines -> h3, newlines -> <br>
  function render(text){
    const esc = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const lines = esc.split("\n").map(line => {
      const m = line.match(/^\s*\*\*(.+?)\*\*\s*$/);
      if(m) return `<h3>${m[1]}</h3>`;
      return line.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
    });
    return lines.join("<br>").replace(/(<br>)?(<h3>)/g,"$2").replace(/(<\/h3>)(<br>)/g,"$1");
  }

  function addBubble(text, who, danger){
    const wrap = document.createElement("div");
    wrap.className = `msg ${who}`;
    const avatar = who === "bot" ? `<div class="avatar">🌿</div>` : "";
    wrap.innerHTML = `${avatar}<div class="bubble ${danger?"danger":""}">${who==="bot"?render(text):text.replace(/</g,"&lt;")}</div>`;
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return wrap;
  }

  function addTyping(){
    const wrap = document.createElement("div");
    wrap.className = "msg bot"; wrap.id = "typing";
    wrap.innerHTML = `<div class="avatar">🌿</div><div class="bubble"><span class="dots"><span></span><span></span><span></span></span></div>`;
    chat.appendChild(wrap); chat.scrollTop = chat.scrollHeight;
  }
  function removeTyping(){ const t = document.getElementById("typing"); if(t) t.remove(); }

  // ---------- Sending a message ----------
  async function send(){
    const text = input.value.trim();
    if(!text) return;
    input.value = ""; input.style.height="auto";

    // If the previous turn already gave a final answer, a new message = new problem.
    if(lastKind === "answer" || lastKind === "escalation"){ resetChat(false); }

    addBubble(text, "user");

    if(problem === null){
      problem = text;                       // first message is the problem
    } else if(lastKind === "followup"){
      history += `\nAssistant asked: ${lastQuestion}\nUser answered: ${text}`;
      followups += 1;
    } else {
      history += `\nUser added: ${text}`;
    }

    sendBtn.disabled = true; addTyping();
    try{
      const res = await fetch("/chat", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ problem, profile: buildProfile(), history, followups, document_text: docText })
      });
      const data = await res.json();
      removeTyping();
      const danger = data.kind === "escalation";
      addBubble(data.answer || "Sorry, I couldn't generate a response.", "bot", danger);
      lastKind = data.kind;
      if(data.kind === "followup") lastQuestion = data.answer;
    }catch(e){
      removeTyping();
      addBubble("⚠️ Could not reach the AI backend. Is the server running?", "bot", true);
    }finally{
      sendBtn.disabled = false; input.focus();
    }
  }

  function resetChat(showHello){
    problem=null; history=""; followups=0; docText=""; lastKind=null; lastQuestion="";
    document.getElementById("attachChip").style.display="none";
    if(showHello){
      chat.innerHTML="";
      addBubble("Namaste 🙏 I'm your Ayurveda & Yoga wellness guide. Tell me what's troubling you, and I'll help with natural remedies, a food chart, and a daily routine.", "bot");
    }
  }

  // ---------- Upload a report ----------
  document.getElementById("attachBtn").onclick = () => document.getElementById("fileInput").click();
  document.getElementById("fileInput").onchange = async (e) => {
    const file = e.target.files[0]; if(!file) return;
    const chip = document.getElementById("attachChip");
    document.getElementById("attachName").textContent = "Reading " + file.name + "…";
    chip.style.display = "flex";
    const fd = new FormData(); fd.append("file", file);
    try{
      const res = await fetch("/upload", { method:"POST", body: fd });
      const data = await res.json();
      docText = data.text || "";
      document.getElementById("attachName").textContent = file.name + (docText? " ✓ added" : " (no text found)");
    }catch{
      document.getElementById("attachName").textContent = "Could not read file";
    }
  };

  // ---------- Wire up ----------
  document.getElementById("newChat").onclick = () => resetChat(true);
  sendBtn.onclick = send;
  input.addEventListener("keydown", e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); } });
  input.addEventListener("input", () => { input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,120)+"px"; });

  resetChat(true); // greeting on load
</script>
</body>
</html>
