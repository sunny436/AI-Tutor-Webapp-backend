name: CI

# One repository, one commit: every push and pull request checks the backend AND the
# frontend, including the API contract that joins them (docs/openapi.json).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, contract, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aichat
          POSTGRES_PASSWORD: aichat
          POSTGRES_DB: aichat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aichat -d aichat"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://aichat:aichat@127.0.0.1:5432/aichat_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: API contract is current (docs/openapi.json)
        run: python scripts/export_openapi.py --check

      - name: Tests (PostgreSQL + pgvector, fake LLM, API end-to-end)
        run: python -m pytest -o addopts="" -ra

  frontend:
    name: Frontend (typecheck, lint, tests incl. contract, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14" # the version production installs (deploy/install.sh)

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests (routes.test.ts checks the BFF against docs/openapi.json)
        run: bun run test

      - name: Production build
        run: bun run build
