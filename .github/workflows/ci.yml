name: CI

on:
  push:
    branches: [main, generic-chat-foundation]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, contract, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aichat
          POSTGRES_PASSWORD: aichat
          POSTGRES_DB: aichat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aichat -d aichat"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: backend-python
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://aichat:aichat@127.0.0.1:5432/aichat_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend-python/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: API contract is current (docs/openapi.json)
        run: python scripts/export_openapi.py --check

      - name: Tests (PostgreSQL + pgvector, fake LLM, API end-to-end)
        run: python -m pytest -o addopts="" -ra
